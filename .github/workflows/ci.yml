name: PricePulse CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_admin_password
          POSTGRES_DB: pricepulse
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pricepulse"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      POSTGRES_ADMIN_PASSWORD: ci_admin_password
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_NAME: pricepulse
      DB_USER: pricepulse_dev
      DB_PASSWORD: ci_dev_password
      API_DB_USER: pricepulse_api
      API_DB_PASSWORD: ci_api_password
      POSTGRES_USER: postgres
      PRICEPULSE_TEST_DB_NAME: pricepulse_loader_test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile Python source
        run: python -m compileall -q scripts tests app

      - name: Wait for PostgreSQL
        run: |
          until pg_isready -h localhost -p 5432 -U postgres; do
            echo "Waiting for postgres…"
            sleep 2
          done

      - name: Apply database schema and migrations
        run: python scripts/migrate.py

      - name: Create isolated loader integration database
        run: createdb -h localhost -U postgres "$PRICEPULSE_TEST_DB_NAME"
        env:
          PGPASSWORD: ci_admin_password

      - name: Apply loader integration schema
        run: python scripts/migrate.py
        env:
          DB_NAME: pricepulse_loader_test

      - name: Run unit/API and loader integration tests (no e2e marker)
        run: python -m pytest -q -m "not e2e"

      - name: Run e2e tests against CI database
        run: python -m pytest -q -m e2e

      - name: Build Airflow test image
        run: docker build -f airflow/Dockerfile -t pricepulse-airflow-test .

      - name: Run Airflow DAG tests
        run: |
          docker run --rm \
            -e PYTHONPATH=/opt/pricepulse \
            -v "$GITHUB_WORKSPACE/airflow/dags:/opt/airflow/dags:ro" \
            --entrypoint bash \
            pricepulse-airflow-test \
            -c "airflow db migrate && pytest /opt/pricepulse/tests/test_dags.py -q -p no:cacheprovider"

      - name: Validate Docker Compose configuration
        run: docker compose config --quiet
