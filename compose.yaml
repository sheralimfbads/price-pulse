
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Set POSTGRES_ADMIN_PASSWORD in .env}
      POSTGRES_DB: pricepulse
      DB_USER: ${DB_USER:-pricepulse_dev}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - pricepulse_db_data:/var/lib/postgresql/data
      - ./docker/postgres/init/00_create_app_role.sh:/docker-entrypoint-initdb.d/00_create_app_role.sh:ro
      - ./sql/001_create_schema.sql:/docker-entrypoint-initdb.d/10_create_staging.sql:ro
      - ./sql/005_create_analytics_model.sql:/docker-entrypoint-initdb.d/20_create_analytics.sql:ro
      - ./docker/postgres/init/90_grant_app_privileges.sh:/docker-entrypoint-initdb.d/90_grant_app_privileges.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pricepulse"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  pipeline:
    build: .
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: pricepulse
      DB_USER: ${DB_USER:-pricepulse_dev}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./data:/app/data

  airflow:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    command: standalone
    restart: unless-stopped
    user: "${LOCAL_UID:-1000}:0"
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: pricepulse
      DB_USER: ${DB_USER:-pricepulse_dev}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - airflow_home:/opt/airflow
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./data:/opt/pricepulse/data
    depends_on:
      db:
        condition: service_healthy


volumes:
  pricepulse_db_data:
  airflow_home:
